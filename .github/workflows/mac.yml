# Сборка NamazBar для macOS на сервере GitHub (Mac не нужен).
# Результат — артефакт «NamazBar-mac»: установочный .dmg и картинки дизайна для проверки.
name: macOS build

on:
  push:
    branches: [ "**" ]   # теги собирает release.yml
    paths: [ "mac/**", "fonts/**", ".github/workflows/mac.yml" ]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app and dmg
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && substring(github.ref_name, 1) || format('1.0.{0}', github.run_number) }}
          TZ: Asia/Tashkent   # сверка расчёта (preview/times.txt) — по местному времени Ташкента
        run: |
          chmod +x mac/build.sh
          swift --version
          mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NamazBar-mac
          path: |
            mac/out/*.dmg
            mac/out/preview/
