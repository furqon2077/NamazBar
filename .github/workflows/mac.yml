# Сборка NamazBar для macOS на сервере GitHub (Mac не нужен).
# Результат — артефакт «NamazBar-mac»: установочный .dmg и картинки дизайна для проверки.
name: macOS build

on:
  push:
    branches: [ "**" ]   # теги собирает release.yml
    paths: [ "mac/**", "fonts/**", ".github/workflows/mac.yml" ]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app and dmg
        env:
          TZ: Asia/Tashkent   # сверка расчёта (preview/times.txt) — по местному времени Ташкента
        run: |
          # тег vX.Y.Z -> версия X.Y.Z, иначе 1.0.<номер сборки>
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; else export VERSION="1.0.$GITHUB_RUN_NUMBER"; fi
          echo "VERSION=$VERSION"
          chmod +x mac/build.sh
          swift --version
          mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NamazBar-mac
          path: |
            mac/out/*.dmg
            mac/out/preview/
