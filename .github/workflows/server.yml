# Тесты чат-сервера (server/)
name: Server tests

on:
  push:
    paths: [ "server/**", "docs/protocol.md", ".github/workflows/server.yml" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
